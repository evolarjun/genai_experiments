<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Meeting Planner</title>
  <style>
    :root {
      --primary-color: #007bff;
      --border-color: #ddd;
      --bg-color: #f8f9fa;
      --selected-bg: #cce5ff;
      --selected-border: #b8daff;
      --hover-bg: #e2e6ea;
      --text-color: #333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 1200px;
      width: 100%;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      padding: 20px;
      box-sizing: border-box;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .title-nav {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .nav-btn {
      background: #fff;
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }

    .nav-btn:hover {
      background: var(--hover-bg);
    }

    .timezone-controls {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }

    .timezone-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    select {
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 1rem;
      max-width: 250px;
    }

    .calendar {
      display: grid;
      grid-template-columns: 80px repeat(7, 1fr);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: #fff;
    }

    .calendar-header {
      display: contents;
    }

    .header-cell {
      padding: 10px;
      background: var(--bg-color);
      border-bottom: 1px solid var(--border-color);
      border-left: 1px solid var(--border-color);
      text-align: center;
      font-weight: bold;
      box-sizing: border-box;
    }

    .header-cell:first-child {
      border-left: none;
    }

    .calendar-body {
      display: contents;
    }

    .time-label {
      padding: 10px;
      text-align: right;
      border-bottom: 1px solid var(--border-color);
      color: #666;
      font-size: 0.9rem;
      background: var(--bg-color);
    }

    .day-column {
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border-color);
    }

    .hour-slot {
      height: 40px;
      border-bottom: 1px solid var(--border-color);
      background: #fff;
      cursor: pointer;
      box-sizing: border-box;
      transition: background-color 0.1s;
    }

    .hour-slot:hover {
      background: var(--hover-bg);
    }

    .hour-slot.selected {
      background: var(--selected-bg);
      border-color: var(--selected-border);
    }

    .result-panel {
      margin-top: 20px;
      padding: 15px;
      background: #e9ecef;
      border-radius: 8px;
      text-align: center;
      font-size: 1.1rem;
      min-height: 24px;
    }

    .result-panel p {
      margin: 5px 0;
    }

  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-nav">
        <h1>World Meeting Planner</h1>
        <button id="prev-week" class="nav-btn">&larr;</button>
        <span id="current-month-year" style="font-weight: bold; font-size: 1.1rem;"></span>
        <button id="next-week" class="nav-btn">&rarr;</button>
        <button id="today-btn" class="nav-btn">Today</button>
      </div>

      <div class="timezone-controls">
        <div class="timezone-group">
          <label for="from-tz">From:</label>
          <select id="from-tz"></select>
        </div>
        <div class="timezone-group">
          <label for="to-tz">To:</label>
          <select id="to-tz"></select>
        </div>
      </div>
    </header>

    <div class="calendar" id="calendar">
      <!-- Headers and Grid will be generated by JS -->
    </div>

    <div class="result-panel" id="result-panel">
      Select a time slot to see details.
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/luxon/3.4.4/luxon.min.js"></script>
  <script>
    const DateTime = luxon.DateTime;
    const Info = luxon.Info;

    // Timezone list including major global cities and common abbreviations
    const timezones = [
      { id: "local", label: "Local Time" },
      { id: "UTC", label: "UTC" },
      { id: "GMT", label: "GMT" },
      { id: "Europe/London", label: "London (GMT/BST)" },
      { id: "Europe/Paris", label: "Paris (CET/CEST)" },
      { id: "Europe/Berlin", label: "Berlin (CET/CEST)" },
      { id: "Europe/Copenhagen", label: "Copenhagen (CET/CEST)" },
      { id: "America/New_York", label: "New York (EST/EDT)" },
      { id: "America/Chicago", label: "Chicago (CST/CDT)" },
      { id: "America/Denver", label: "Denver (MST/MDT)" },
      { id: "America/Los_Angeles", label: "Los Angeles (PST/PDT)" },
      { id: "Asia/Tokyo", label: "Tokyo (JST)" },
      { id: "Asia/Shanghai", label: "Shanghai (CST)" },
      { id: "Asia/Kolkata", label: "New Delhi (IST)" },
      { id: "Australia/Sydney", label: "Sydney (AEST/AEDT)" },
      { id: "Pacific/Auckland", label: "Auckland (NZST/NZDT)" }
    ];

    // Elements
    const fromTzSelect = document.getElementById("from-tz");
    const toTzSelect = document.getElementById("to-tz");
    const prevWeekBtn = document.getElementById("prev-week");
    const nextWeekBtn = document.getElementById("next-week");
    const todayBtn = document.getElementById("today-btn");
    const currentMonthYearSpan = document.getElementById("current-month-year");
    const calendarEl = document.getElementById("calendar");
    const resultPanel = document.getElementById("result-panel");

    // State
    let localTimezone = luxon.Settings.defaultZoneName;
    let selectedFromTz = localTimezone;
    let selectedToTz = "UTC"; // Default to UTC
    let currentWeekStart = DateTime.local().startOf("week", { useLocaleWeeks: false, weekStartsOn: 7 }); // Sunday

    // Interaction State
    let isDragging = false;
    let dragStartDay = null;
    let dragStartHour = null;
    let selectedSlots = []; // Array of { day, hour }

    // Initialization
    function init() {
      populateTimezones();
      updateHeader();
      renderGrid();

      // Event Listeners
      fromTzSelect.addEventListener("change", (e) => {
        selectedFromTz = e.target.value === "local" ? localTimezone : e.target.value;
        renderGrid(); // re-render grid on timezone change
      });

      toTzSelect.addEventListener("change", (e) => {
        selectedToTz = e.target.value === "local" ? localTimezone : e.target.value;
        updateResult(); // update result if a slot is selected
      });

      prevWeekBtn.addEventListener("click", () => {
        currentWeekStart = currentWeekStart.minus({ weeks: 1 });
        updateHeader();
        renderGrid();
      });

      nextWeekBtn.addEventListener("click", () => {
        currentWeekStart = currentWeekStart.plus({ weeks: 1 });
        updateHeader();
        renderGrid();
      });

      todayBtn.addEventListener("click", () => {
        currentWeekStart = DateTime.local().startOf("week", { useLocaleWeeks: false, weekStartsOn: 7 });
        updateHeader();
        renderGrid();
      });
    }

    function populateTimezones() {
      timezones.forEach(tz => {
        const option1 = document.createElement("option");
        option1.value = tz.id;
        option1.textContent = tz.label;
        if (tz.id === "local") option1.selected = true; // Default From to Local
        fromTzSelect.appendChild(option1);

        const option2 = document.createElement("option");
        option2.value = tz.id;
        option2.textContent = tz.label;
        if (tz.id === "UTC") option2.selected = true; // Default To to UTC
        toTzSelect.appendChild(option2);
      });
    }

    function updateHeader() {
      const start = currentWeekStart;
      const end = currentWeekStart.plus({ days: 6 });

      let monthYearStr = start.toFormat("MMMM yyyy");
      if (start.month !== end.month) {
        if (start.year !== end.year) {
          monthYearStr = `${start.toFormat("MMM yyyy")} - ${end.toFormat("MMM yyyy")}`;
        } else {
          monthYearStr = `${start.toFormat("MMM")} - ${end.toFormat("MMM yyyy")}`;
        }
      }
      currentMonthYearSpan.textContent = monthYearStr;
    }

    function formatHour(hour) {
      if (hour === 0) return "12am";
      if (hour === 12) return "12pm";
      return hour > 12 ? `${hour - 12}pm` : `${hour}am`;
    }

    function renderGrid() {
      calendarEl.innerHTML = '';

      // 1. Calendar Header
      const headerDiv = document.createElement("div");
      headerDiv.className = "calendar-header";

      const tzCorner = document.createElement("div");
      tzCorner.className = "header-cell";
      tzCorner.style.fontSize = "0.8rem";
      tzCorner.style.color = "#666";
      tzCorner.innerHTML = `Time<br>(${selectedFromTz === localTimezone ? "Local" : selectedFromTz.split('/').pop()})`;
      headerDiv.appendChild(tzCorner);

      const days = [];
      for (let i = 0; i < 7; i++) {
        const dayDate = currentWeekStart.plus({ days: i }).setZone(selectedFromTz);
        days.push(dayDate);
        const dayCell = document.createElement("div");
        dayCell.className = "header-cell";
        dayCell.textContent = dayDate.toFormat("ccc, LLL d"); // e.g. Sun, Mar 22
        headerDiv.appendChild(dayCell);
      }
      calendarEl.appendChild(headerDiv);

      // 2. Calendar Body
      const bodyDiv = document.createElement("div");
      bodyDiv.className = "calendar-body";

      // Time Column (Hours 0-23)
      const timeCol = document.createElement("div");
      timeCol.className = "day-column";
      timeCol.style.borderLeft = "none";
      for (let h = 0; h < 24; h++) {
        const timeLabel = document.createElement("div");
        timeLabel.className = "time-label";
        timeLabel.style.height = "40px";
        timeLabel.style.boxSizing = "border-box";
        timeLabel.textContent = formatHour(h);
        timeCol.appendChild(timeLabel);
      }
      bodyDiv.appendChild(timeCol);

      // Day Columns
      days.forEach((dayDate, dayIndex) => {
        const dayCol = document.createElement("div");
        dayCol.className = "day-column";

        for (let h = 0; h < 24; h++) {
          const slot = document.createElement("div");
          slot.className = "hour-slot";
          slot.dataset.day = dayIndex;
          slot.dataset.hour = h;

          slot.addEventListener("mousedown", handleSlotMouseDown);
          slot.addEventListener("mouseenter", handleSlotMouseEnter);

          dayCol.appendChild(slot);
        }
        bodyDiv.appendChild(dayCol);
      });

      calendarEl.appendChild(bodyDiv);

      // Reset selections when grid re-renders
      selectedSlots = [];
      updateResult();
    }

    function handleSlotMouseDown(e) {
      if (e.button !== 0) return; // Only left click
      isDragging = true;
      const day = parseInt(e.target.dataset.day, 10);
      const hour = parseInt(e.target.dataset.hour, 10);

      dragStartDay = day;
      dragStartHour = hour;

      selectedSlots = [{ day, hour }];
      renderSelection();
      updateResult();
    }

    function handleSlotMouseEnter(e) {
      if (!isDragging) return;

      const currentDay = parseInt(e.target.dataset.day, 10);
      const currentHour = parseInt(e.target.dataset.hour, 10);

      // Constraint: Must be on the same day
      if (currentDay !== dragStartDay) return;

      const start = Math.min(dragStartHour, currentHour);
      const end = Math.max(dragStartHour, currentHour);

      selectedSlots = [];
      for (let h = start; h <= end; h++) {
        selectedSlots.push({ day: dragStartDay, hour: h });
      }

      renderSelection();
      updateResult();
    }

    // Stop dragging when mouse goes up anywhere on the document
    document.addEventListener("mouseup", () => {
      isDragging = false;
    });

    // Also stop dragging if the mouse leaves the calendar area entirely
    document.addEventListener("mouseleave", () => {
      isDragging = false;
    });

    // Prevent default drag-and-drop behavior that might interfere with custom dragging
    document.addEventListener("dragstart", (e) => {
      e.preventDefault();
    });

    function renderSelection() {
      document.querySelectorAll('.hour-slot').forEach(slot => {
        const day = parseInt(slot.dataset.day, 10);
        const hour = parseInt(slot.dataset.hour, 10);

        const isSelected = selectedSlots.some(s => s.day === day && s.hour === hour);
        if (isSelected) {
          slot.classList.add('selected');
        } else {
          slot.classList.remove('selected');
        }
      });
    }

    function updateResult() {
      if (selectedSlots.length === 0) {
        resultPanel.innerHTML = "Select a time slot to see details.";
        return;
      }

      // We know all selected slots are on the same day due to constraints
      const dayIndex = selectedSlots[0].day;

      // Find min and max hour
      const hours = selectedSlots.map(s => s.hour);
      const startHour = Math.min(...hours);
      const endHour = Math.max(...hours) + 1; // +1 because a slot represents 1 hour duration

      const dayDateFrom = currentWeekStart.plus({ days: dayIndex }).setZone(selectedFromTz).set({ hour: 0, minute: 0, second: 0, millisecond: 0 });

      const durationHours = endHour - startHour;
      const startTimeFrom = dayDateFrom.set({ hour: startHour });
      const endTimeFrom = startTimeFrom.plus({ hours: durationHours });

      const startTimeTo = startTimeFrom.setZone(selectedToTz);
      const endTimeTo = endTimeFrom.setZone(selectedToTz);

      const formatTime = (dt) => dt.minute === 0 ? dt.toFormat("ha").toLowerCase() : dt.toFormat("h:mma").toLowerCase();
      const formatDate = (dt) => dt.toFormat("cccc MMMM d");

      const fromLabel = selectedFromTz === localTimezone ? "Your Time" : "Time";
      const fromTzName = timezones.find(t => t.id === selectedFromTz)?.label || selectedFromTz.split('/').pop();
      const toTzName = timezones.find(t => t.id === selectedToTz)?.label || selectedToTz.split('/').pop();

      const fromString = `${fromLabel} (${fromTzName}): <strong>${formatDate(startTimeFrom)} from ${formatTime(startTimeFrom)} to ${formatTime(endTimeFrom)}</strong>`;

      let toString = `Their Time (${toTzName}): <strong>`;
      // Check if "to" time spans a different day
      if (startTimeTo.hasSame(endTimeTo, 'day') && startTimeTo.hasSame(startTimeFrom, 'day')) {
        toString += `${formatTime(startTimeTo)} to ${formatTime(endTimeTo)}</strong>`;
      } else {
        // If the day is different in the destination timezone, include the date
        toString += `${formatDate(startTimeTo)} from ${formatTime(startTimeTo)} to ${formatTime(endTimeTo)}</strong>`;
      }

      resultPanel.innerHTML = `<p>${fromString}</p><p>${toString}</p>`;
    }

    document.addEventListener("DOMContentLoaded", init);

  </script>
</body>
</html>
